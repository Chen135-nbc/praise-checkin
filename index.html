<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夸夸打卡器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Task Praise</p>
        <h1>夸夸打卡器</h1>
      </div>
      <a class="icon-link" href="statistic.html">统计</a>
    </header>

    <section class="history-section">
      <div class="section-title">
        <div>
          <h2>进行中的任务</h2>
          <p id="praiseText" class="muted praise-line">先添加一个任务，然后给努力的自己打卡。</p>
        </div>
        <button id="clearAllBtn" class="text-button" type="button">清空全部</button>
      </div>
      <div id="taskList" class="task-list"></div>
    </section>

    <section class="stats-grid" aria-label="任务概览">
      <article class="stat-card">
        <span>进行中</span>
        <strong id="taskCount">0</strong>
        <small>项</small>
      </article>
      <article class="stat-card">
        <span>今日打卡</span>
        <strong id="todayCount">0</strong>
        <small>次</small>
      </article>
      <article class="stat-card">
        <span>已归档</span>
        <strong id="archivedCount">0</strong>
        <small>项</small>
      </article>
    </section>

    <section class="hero-panel">
      <div class="section-title">
        <div>
          <h2>添加打卡任务</h2>
          <p class="muted">设置目标数量后，进度条最大值会自动变成目标数量的 5 倍。</p>
        </div>
      </div>

      <form id="taskForm" class="task-form">
        <label>
          <span>任务名称</span>
          <input id="taskName" type="text" maxlength="30" placeholder="例如：Python 教学视频" required>
        </label>
        <label>
          <span>目标数量</span>
          <input id="taskTarget" type="number" min="1" max="999" placeholder="2" required>
        </label>
        <label>
          <span>单位</span>
          <input id="taskUnit" type="text" maxlength="8" placeholder="个">
        </label>
        <label>
          <span>打卡频率</span>
          <select id="taskFrequency">
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="custom">自定义每周天数</option>
          </select>
        </label>
        <label id="taskWeeklyDaysLabel" class="weekly-days-field" hidden>
          <span>每周天数</span>
          <input id="taskWeeklyDays" type="number" min="1" max="7" value="3">
        </label>
        <button class="primary-button" type="submit">添加任务</button>
      </form>
    </section>

    <section class="history-section">
      <div class="section-title">
        <div>
          <h2>已归档任务</h2>
          <p class="muted">归档后不再参与今日任务，但历史打卡仍会进入统计。</p>
        </div>
      </div>
      <div id="archivedTaskList" class="task-list"></div>
    </section>
  </main>

  <div id="praiseModal" class="modal-backdrop" hidden>
    <section class="praise-modal" role="dialog" aria-modal="true" aria-labelledby="praiseModalTitle">
      <p id="praiseModalPercent" class="modal-percent">50%</p>
      <h2 id="praiseModalTitle">稳稳推进</h2>
      <p id="praiseModalText"></p>
      <button id="praiseModalClose" class="primary-button" type="button">收下夸夸</button>
    </section>
  </div>

  <template id="taskTemplate">
    <article class="task-card">
      <div class="task-card-header">
        <div>
          <div class="title-row">
            <h3></h3>
            <span class="task-status"></span>
          </div>
          <p class="task-meta"></p>
        </div>
        <div class="card-tools">
          <button class="tool-button edit-button" type="button">编辑</button>
          <button class="tool-button archive-button" type="button">归档</button>
          <button class="delete-button" type="button" aria-label="删除任务">删除</button>
        </div>
      </div>

      <form class="edit-form" hidden>
        <label>
          <span>任务名称</span>
          <input class="edit-name" type="text" maxlength="30" required>
        </label>
        <label>
          <span>目标数量</span>
          <input class="edit-target" type="number" min="1" max="999" required>
        </label>
        <label>
          <span>单位</span>
          <input class="edit-unit" type="text" maxlength="8">
        </label>
        <label>
          <span>打卡频率</span>
          <select class="edit-frequency">
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="custom">自定义每周天数</option>
          </select>
        </label>
        <label class="weekly-days-field edit-weekly-days-field" hidden>
          <span>每周天数</span>
          <input class="edit-weekly-days" type="number" min="1" max="7" value="3">
        </label>
        <div class="edit-actions">
          <button class="small-button cancel-edit-button" type="button">取消</button>
          <button class="check-button" type="submit">保存</button>
        </div>
      </form>

      <div class="task-progress-area">
        <div class="progress-readout">
          <strong class="progress-value">0</strong>
          <span class="progress-unit"></span>
        </div>

        <input class="task-slider" type="range" min="0" value="0">

        <div class="task-actions">
          <button class="small-button minus-button" type="button">-1</button>
          <button class="check-button checkin-button" type="button">打卡</button>
          <button class="small-button plus-button" type="button">+1</button>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
