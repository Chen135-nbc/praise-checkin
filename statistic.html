<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务统计 - 夸夸打卡器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Progress</p>
        <h1>任务统计</h1>
      </div>
      <a class="icon-link" href="index.html">返回</a>
    </header>

    <section class="history-section">
      <div class="section-title">
        <div>
          <h2>任务进度</h2>
          <p class="muted">超过目标也会继续统计，进度条上限为目标数量的 5 倍。已归档任务会保留历史。</p>
        </div>
      </div>
      <div id="progressList" class="progress-list"></div>
    </section>

    <section class="history-section heatmap-section" aria-label="打卡热力图">
      <div class="section-title">
        <div>
          <h2>打卡热力图</h2>
          <p id="heatmapMonth" class="muted">本月打卡量越多，颜色越深。</p>
        </div>
        <label class="heatmap-filter">
          <span>查看任务</span>
          <select id="heatmapTaskSelect">
            <option value="all">全部任务</option>
          </select>
        </label>
      </div>
      <div id="heatmapSummary" class="heatmap-summary"></div>
      <div id="heatmapGrid" class="heatmap-grid"></div>
      <div class="heatmap-legend" aria-label="颜色深浅说明">
        <span>少</span>
        <i data-level="1"></i>
        <i data-level="2"></i>
        <i data-level="3"></i>
        <i data-level="4"></i>
        <i data-level="5"></i>
        <span>多</span>
      </div>
    </section>

    <section class="history-section">
      <div class="section-title">
        <h2>打卡记录</h2>
        <span id="recordHint" class="muted"></span>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <nav id="historyPagination" class="pagination" aria-label="打卡记录分页"></nav>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "praise-task-checkins";
    const progressList = document.querySelector("#progressList");
    const heatmapMonth = document.querySelector("#heatmapMonth");
    const heatmapTaskSelect = document.querySelector("#heatmapTaskSelect");
    const heatmapSummary = document.querySelector("#heatmapSummary");
    const heatmapGrid = document.querySelector("#heatmapGrid");
    const recordHint = document.querySelector("#recordHint");
    const historyList = document.querySelector("#historyList");
    const historyPagination = document.querySelector("#historyPagination");
    const RECORDS_PER_PAGE = 10;
    let currentHistoryPage = 1;

    function getTodayKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getLogTimestamp(log) {
      if (Number.isFinite(Number(log.timestamp))) {
        return Number(log.timestamp);
      }
      return Date.parse(log.createdAt || log.date) || 0;
    }

    function getLogDate(log) {
      const timestamp = getLogTimestamp(log);
      return timestamp ? getTodayKey(new Date(timestamp)) : log.date;
    }

    function getWeekStart(date = new Date()) {
      const start = new Date(date);
      const day = start.getDay() || 7;
      start.setHours(0, 0, 0, 0);
      start.setDate(start.getDate() - day + 1);
      return start.getTime();
    }

    function normalizeFrequency(frequency) {
      const type = frequency?.type || "daily";
      const weeklyDays = Math.min(Math.max(Number(frequency?.weeklyDays) || 1, 1), 7);
      if (type === "weekly") {
        return { type: "weekly", weeklyDays: 1 };
      }
      if (type === "custom") {
        return { type: "custom", weeklyDays };
      }
      return { type: "daily", weeklyDays: 1 };
    }

    function normalizeTotalTarget(value) {
      const totalTarget = Number(value);
      return Number.isInteger(totalTarget) && totalTarget > 0 ? totalTarget : null;
    }

    function getTotalProgress(task) {
      return (task.logs || []).reduce((sum, log) => sum + Number(log.amount || 0), 0);
    }

    function getTotalProgressPercent(task) {
      if (!task.totalTarget) {
        return 0;
      }
      return Math.min(Math.round((getTotalProgress(task) / Number(task.totalTarget)) * 100), 100);
    }

    function getCompletionDateLabel(task) {
      if (!task.completedAt) {
        return "";
      }
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date(task.completedAt));
    }

    function getFrequencyLabel(task) {
      const frequency = normalizeFrequency(task.frequency);
      if (frequency.type === "weekly") {
        return "每周打卡 1 天";
      }
      if (frequency.type === "custom") {
        return `每周打卡 ${frequency.weeklyDays} 天`;
      }
      return "每天打卡";
    }

    function getTaskPeriodStatus(task, now = new Date()) {
      const frequency = normalizeFrequency(task.frequency);
      const logs = task.logs || [];
      const todayKey = getTodayKey(now);
      const weekStart = getWeekStart(now);
      const weekLogs = logs.filter((log) => getLogTimestamp(log) >= weekStart);
      const weekDays = new Set(weekLogs.map((log) => getLogDate(log))).size;

      if (task.archived) {
        return {
          done: false,
          actual: weekDays,
          required: frequency.type === "custom" ? frequency.weeklyDays : 1,
          text: `已归档，本周曾打卡 ${weekDays} 天`
        };
      }

      if (frequency.type === "daily") {
        const done = logs.some((log) => getLogDate(log) === todayKey);
        return {
          done,
          actual: done ? 1 : 0,
          required: 1,
          text: done ? "今日已完成" : "今日未打卡"
        };
      }

      const required = frequency.type === "custom" ? frequency.weeklyDays : 1;
      const done = weekDays >= required;
      return {
        done,
        actual: weekDays,
        required,
        text: done ? `本周已达标，完成 ${weekDays}/${required} 天` : `本周还差 ${required - weekDays} 天，当前 ${weekDays}/${required} 天`
      };
    }

    function normalizeTasks(tasks) {
      return tasks.map((task) => ({
        ...task,
        archived: Boolean(task.archived),
        totalTarget: normalizeTotalTarget(task.totalTarget),
        frequency: normalizeFrequency(task.frequency),
        logs: (task.logs || []).map((log) => {
          const timestamp = getLogTimestamp(log) || Date.now();
          return {
            ...log,
            timestamp,
            date: getTodayKey(new Date(timestamp)),
            createdAt: log.createdAt || new Date(timestamp).toISOString()
          };
        })
      }));
    }

    async function readTasks() {
      try {
        const response = await fetch("/api/tasks", { cache: "no-store" });
        if (response.ok) {
          const data = await response.json();
          return normalizeTasks(Array.isArray(data.tasks) ? data.tasks : []);
        }
      } catch {
        // Directly opening the HTML cannot use the JSON file API, so keep a browser fallback.
      }

      try {
        const tasks = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return normalizeTasks(Array.isArray(tasks) ? tasks : []);
      } catch {
        return [];
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function formatTime(value) {
      return new Intl.DateTimeFormat("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function formatFullTime(value) {
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date(value));
    }

    function renderHeatmap(tasks) {
      const selectedValue = heatmapTaskSelect.value || "all";
      const hasSelectedTask = selectedValue === "all" || tasks.some((task) => task.id === selectedValue);
      const selectedTaskId = hasSelectedTask ? selectedValue : "all";
      const selectedTasks = selectedTaskId === "all" ? tasks : tasks.filter((task) => task.id === selectedTaskId);
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();
      const monthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
      const dayAmounts = new Map();

      heatmapMonth.textContent = `${year}年${month + 1}月 · 单日打卡量越多，颜色越深。`;
      heatmapTaskSelect.innerHTML = '<option value="all">全部任务</option>';
      tasks.forEach((task) => {
        const option = document.createElement("option");
        option.value = task.id;
        option.textContent = `${task.name}${task.archived ? "（已归档）" : ""}`;
        heatmapTaskSelect.appendChild(option);
      });
      heatmapTaskSelect.value = selectedTaskId;

      selectedTasks.forEach((task) => {
        (task.logs || []).forEach((log) => {
          const dateKey = getLogDate(log);
          if (!dateKey.startsWith(monthKey)) {
            return;
          }
          dayAmounts.set(dateKey, (dayAmounts.get(dateKey) || 0) + Number(log.amount || 0));
        });
      });

      const amounts = [...dayAmounts.values()];
      const maxAmount = Math.max(...amounts, 0);
      const totalAmount = amounts.reduce((sum, amount) => sum + amount, 0);
      const activeDays = amounts.filter((amount) => amount > 0).length;
      const strongest = [...dayAmounts.entries()].sort((a, b) => b[1] - a[1])[0];
      const selectedName = selectedTaskId === "all"
        ? "全部任务"
        : tasks.find((task) => task.id === selectedTaskId)?.name || "全部任务";

      heatmapSummary.innerHTML = `
        <span>${escapeHtml(selectedName)}</span>
        <span>打卡天数 ${activeDays} 天</span>
        <span>累计打卡量 ${totalAmount}</span>
        <span>最高单日 ${strongest ? `${strongest[1]} · ${strongest[0]}` : "暂无"}</span>
      `;

      heatmapGrid.innerHTML = "";
      ["日", "一", "二", "三", "四", "五", "六"].forEach((label) => {
        const cell = document.createElement("span");
        cell.className = "heatmap-weekday";
        cell.textContent = label;
        heatmapGrid.appendChild(cell);
      });

      for (let index = 0; index < firstDay; index += 1) {
        const empty = document.createElement("span");
        empty.className = "heatmap-day is-empty";
        heatmapGrid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const dateKey = `${monthKey}-${String(day).padStart(2, "0")}`;
        const amount = dayAmounts.get(dateKey) || 0;
        const level = amount === 0 || maxAmount === 0 ? 0 : Math.max(1, Math.ceil((amount / maxAmount) * 5));
        const cell = document.createElement("span");
        cell.className = "heatmap-day";
        cell.dataset.level = level;
        cell.textContent = day;
        cell.title = `${dateKey} · 打卡量 ${amount}`;
        cell.classList.toggle("is-today", dateKey === getTodayKey());
        heatmapGrid.appendChild(cell);
      }
    }

    function renderHistory(logs) {
      const totalPages = Math.max(Math.ceil(logs.length / RECORDS_PER_PAGE), 1);
      currentHistoryPage = Math.min(Math.max(currentHistoryPage, 1), totalPages);
      const start = (currentHistoryPage - 1) * RECORDS_PER_PAGE;
      const pageLogs = logs.slice(start, start + RECORDS_PER_PAGE);

      recordHint.textContent = logs.length > 0
        ? `共 ${logs.length} 条 · 第 ${currentHistoryPage}/${totalPages} 页`
        : "0 条";
      historyList.innerHTML = "";
      historyPagination.innerHTML = "";

      if (logs.length === 0) {
        historyList.innerHTML = '<li class="empty-state">暂无打卡记录。</li>';
        return;
      }

      pageLogs.forEach((log) => {
        const timestamp = getLogTimestamp(log);
        const item = document.createElement("li");
        item.className = "history-item";
        item.innerHTML = `
          <time datetime="${new Date(timestamp).toISOString()}">${formatFullTime(timestamp)}</time>
          <p>${escapeHtml(log.taskName)} 打卡到 ${log.amount}${escapeHtml(log.unit)}</p>
          <span>${log.archived ? "已归档任务" : "进行中任务"} · ${getLogDate(log)}</span>
        `;
        historyList.appendChild(item);
      });

      if (totalPages <= 1) {
        return;
      }

      const previousButton = document.createElement("button");
      previousButton.type = "button";
      previousButton.textContent = "上一页";
      previousButton.dataset.page = String(currentHistoryPage - 1);
      previousButton.disabled = currentHistoryPage === 1;
      historyPagination.appendChild(previousButton);

      for (let page = 1; page <= totalPages; page += 1) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = String(page);
        button.dataset.page = String(page);
        button.classList.toggle("is-active", page === currentHistoryPage);
        historyPagination.appendChild(button);
      }

      const nextButton = document.createElement("button");
      nextButton.type = "button";
      nextButton.textContent = "下一页";
      nextButton.dataset.page = String(currentHistoryPage + 1);
      nextButton.disabled = currentHistoryPage === totalPages;
      historyPagination.appendChild(nextButton);
    }

    async function render() {
      const tasks = await readTasks();
      const logs = tasks.flatMap((task) => (task.logs || []).map((log) => ({
        ...log,
        taskId: task.id,
        taskName: task.name,
        unit: task.unit,
        archived: task.archived
      }))).sort((a, b) => getLogTimestamp(b) - getLogTimestamp(a));

      renderHeatmap(tasks);

      progressList.innerHTML = "";
      if (tasks.length === 0) {
        progressList.innerHTML = '<p class="empty-state">暂无任务。</p>';
      } else {
        tasks.forEach((task) => {
          const max = Number(task.target) * 5;
          const progress = Number(task.progress) || 0;
          const totalProgress = getTotalProgress(task);
          const totalTarget = normalizeTotalTarget(task.totalTarget);
          const totalPercent = getTotalProgressPercent(task);
          const targetPercent = Math.min((progress / Number(task.target)) * 100, 500);
          const barPercent = totalTarget ? totalPercent : Math.min((progress / max) * 100, 100);
          const periodStatus = getTaskPeriodStatus(task);
          const item = document.createElement("article");
          item.className = "progress-item";
          item.classList.toggle("is-period-done", periodStatus.done);
          item.innerHTML = `
            <div class="progress-item-head">
              <strong>${escapeHtml(task.name)}${task.archived ? "（已归档）" : ""}</strong>
              <span>${totalTarget ? `${totalProgress}${escapeHtml(task.unit)} / ${totalTarget}${escapeHtml(task.unit)}` : `${progress}${escapeHtml(task.unit)} / ${task.target}${escapeHtml(task.unit)}`}</span>
            </div>
            <div class="meter" style="--fill: ${barPercent}%">
              <span></span>
            </div>
            <p class="muted">${getFrequencyLabel(task)} · ${periodStatus.text}</p>
            <p class="muted">${totalTarget ? `总进度 ${totalProgress}/${totalTarget}${escapeHtml(task.unit)} · ${totalPercent}%${task.completedAt ? ` · 完成日期 ${getCompletionDateLabel(task)}` : ""}` : "未设置总目标"}</p>
            <p class="muted">目标完成度 ${Math.round(targetPercent)}%，进度条范围 0-${max}${escapeHtml(task.unit)}</p>
          `;
          progressList.appendChild(item);
        });
      }

      renderHistory(logs);
    }

    heatmapTaskSelect.addEventListener("change", render);

    historyPagination.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-page]");
      if (!button || button.disabled) {
        return;
      }
      currentHistoryPage = Number(button.dataset.page);
      render();
    });

    render();
  </script>
</body>
</html>
